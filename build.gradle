plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.12'
}

version = '2.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'io.github.cdimascio:dotenv-java:3.2.0'
    specFileImplementation 'io.github.cdimascio:dotenv-java:3.2.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

nextflowPlugin {
    nextflowVersion = '25.10.0'
    provider = 'Fulcrum Genomics LLC'
    className = 'com.fulcrumgenomics.nextflow.plugin.DotenvPlugin'
    extensionPoints = [
        'com.fulcrumgenomics.nextflow.plugin.DotenvConfig',
        'com.fulcrumgenomics.nextflow.plugin.DotenvExtension'
    ]
}
